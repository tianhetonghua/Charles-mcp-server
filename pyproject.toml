[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charles-mcp-server" 
version = "3.0.1"
description = "Charles Proxy MCP 服务器，checkpoint 时间线 + 增量收割，专为 AI agent 逆向分析设计"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "tianhetonghua" }]
dependencies = [
    "mcp",
    "requests",
    "fastmcp"
]

[project.scripts]
charles-mcp-server = "charles_mcp_server.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["charles_mcp_server*"]