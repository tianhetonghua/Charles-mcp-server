[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "charles-mcp-server" 
version = "2.1.0"
description = "高性能 Charles Proxy MCP 服务器，支持内存缓存、弱网模拟与熵值分析"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "tianhetonghua" }]
dependencies = [
    "mcp",
    "requests",
    "fastmcp"
]

[project.scripts]
charles-mcp-server = "charles_mcp_server.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["charles_mcp_server*"]